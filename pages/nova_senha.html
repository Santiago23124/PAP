<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - 100 Sabores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            width: 80px;
            height: auto;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #28a745;
        }
        .password requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #218838;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #28a745;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="../imagens/logo/Logotipo_restaurante.png" alt="100 Sabores">
        </div>
        
        <h1>Nova Senha</h1>
        <p class="subtitle">Crie uma nova senha para a sua conta.</p>
        
        <div id="message"></div>
        
        <form id="newPasswordForm">
            <div class="form-group">
                <label for="nova_senha">Nova Senha:</label>
                <input type="password" id="nova_senha" name="nova_senha" required minlength="6" placeholder="Mínimo 6 caracteres">
                <p class="password-requirements">A senha deve ter pelo menos 6 caracteres.</p>
            </div>
            
            <div class="form-group">
                <label for="confirmar_senha">Confirmar Senha:</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha" required minlength="6" placeholder="Confirme a senha">
            </div>
            
            <button type="submit" id="submitBtn">Alterar Senha</button>
        </form>
        
        <div class="back-link">
            <a href="login.html">← Voltar ao Login</a>
        </div>
    </div>

    <script>
        // Obter token da URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            document.getElementById('message').innerHTML = '<div class="message error">Token inválido ou expirado.</div>';
            document.getElementById('newPasswordForm').style.display = 'none';
        }
        
        document.getElementById('newPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const novaSenha = document.getElementById('nova_senha').value;
            const confirmarSenha = document.getElementById('confirmar_senha').value;
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            
            if (novaSenha !== confirmarSenha) {
                messageDiv.innerHTML = '<div class="message error">As senhas não coincidem.</div>';
                return;
            }
            
            if (novaSenha.length < 6) {
                messageDiv.innerHTML = '<div class="message error">A senha deve ter pelo menos 6 caracteres.</div>';
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'A processar...';
            messageDiv.innerHTML = '';
            
            fetch('http://localhost/PAP-100%20Sabores/api/nova_senha.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    token: token,
                    nova_senha: novaSenha
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.sucesso) {
                    messageDiv.innerHTML = '<div class="message success">' + data.mensagem + '</div>';
                    document.getElementById('newPasswordForm').reset();
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    messageDiv.innerHTML = '<div class="message error">' + data.erro + '</div>';
                }
            })
            .catch(error => {
                messageDiv.innerHTML = '<div class="message error">Erro ao procesar pedido. Tente novamente.</div>';
                console.error('Erro:', error);
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Alterar Senha';
            });
        });
    </script>
</body>
</html>
